<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F3EE">
  <title>Coffee Cellar</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Coffee">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="brand"><span class="brand-mark" aria-hidden="true">◒</span> Coffee Cellar <span class="brand-note">YOUR PERSONAL COLLECTION</span></header>
  <main id="app"><p class="loading">セラーを開いています…</p></main>
  <nav id="nav" aria-label="メインナビゲーション"></nav>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <dialog id="confirm"><h2>確認</h2><p></p><div class="actions"><button class="secondary" id="cancel-confirm" autofocus>キャンセル</button><button class="danger" id="accept-confirm">完全に削除</button></div></dialog>

</html>
