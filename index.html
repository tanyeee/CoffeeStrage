<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F3EE">
  <title>Coffee Cellar</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Coffee">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="brand"><span class="brand-mark" aria-hidden="true">◒</span> Coffee Cellar <span class="brand-note">YOUR PERSONAL COLLECTION</span></header>
  <main id="app"><p class="loading">セラーを開いています…</p></main>
  <nav id="nav" aria-label="メインナビゲーション"></nav>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <dialog id="opened"><h2>開封日</h2><form method="dialog" id="opened-form"><div class="field"><label for="opened-date">開封した日</label><input type="date" id="opened-date" name="date"></div><div class="actions"><button class="secondary" value="cancel">キャンセル</button><button class="primary" value="save">保存</button></div><div class="actions"><button class="secondary" value="unknown">日付不明</button><button class="secondary" value="none" id="opened-clear">未開封に戻す</button></div></form></dialog>
  <dialog id="confirm"><h2>確認</h2><p></p><div class="actions"><button class="secondary" id="cancel-confirm" autofocus>キャンセル</button><button class="danger" id="accept-confirm">完全に削除</button></div></dialog>
  <noscript>このアプリを利用するにはJavaScriptを有効にしてください。</noscript>
</body>
</html>
